<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advaiya Bahl — CV</title>
<meta name="description" content="Advaiya Bahl — Year 2 Economics student at Kitas Gymnasium. Bilingual CV (English / Svenska), Classic and Interactive versions.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316202e'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
</head>
<body>
<a class="skip-link" href="#main" id="skipLink">Skip to content</a>

<header class="topbar" role="banner">
  <div class="topbar-inner">
    <a class="brand" href="./" id="brandLink" aria-label="Advaiya Bahl — CV home">AB<span aria-hidden="true">.</span></a>
    <div class="controls" role="group" aria-label="View controls">
      <div class="seg" role="group" aria-label="Language / Språk">
        <button type="button" id="langEn" aria-pressed="true">EN</button>
        <button type="button" id="langSv" aria-pressed="false">SV</button>
      </div>
      <div class="seg" role="group" aria-label="Version">
        <button type="button" id="viewClassic" aria-pressed="true">Classic</button>
        <button type="button" id="viewInteractive" aria-pressed="false">Interactive</button>
      </div>
    </div>
  </div>
</header>

<nav class="section-nav" id="sectionNav" aria-label="Sections" hidden>
  <div class="section-nav-inner" id="sectionNavInner"></div>
</nav>

<main id="main">
  <!-- CLASSIC VIEW -->
  <article id="classicView" class="classic" aria-label="Classic CV">
    <div id="classicRoot"></div>
    <div class="classic-download">
      <a class="btn primary" id="classicDownloadBtn" href="pdfs/Advaiya-Bahl-CV-EN.pdf" download>
        <span aria-hidden="true">&#8595;</span> <span id="classicDownloadLabel">Download English PDF</span>
      </a>
      <p class="alt-download"><span id="classicAltPrefix">Also available:</span>
        <a id="classicAltLink" href="pdfs/Advaiya-Bahl-CV-SV.pdf" download>Ladda ner svensk PDF</a>
      </p>
    </div>
  </article>

  <!-- INTERACTIVE VIEW -->
  <article id="interactiveView" class="interactive" aria-label="Interactive CV" hidden>
    <div id="interactiveRoot"></div>
    <div class="interactive-download">
      <a class="btn primary" id="interactiveDownloadBtn" href="pdfs/Advaiya-Bahl-CV-EN.pdf" download>
        <span aria-hidden="true">&#8595;</span> <span id="interactiveDownloadLabel">Download English PDF</span>
      </a>
      <p class="alt-download"><span id="interactiveAltPrefix">Also available:</span>
        <a id="interactiveAltLink" href="pdfs/Advaiya-Bahl-CV-SV.pdf" download>Ladda ner svensk PDF</a>
      </p>
    </div>
  </article>
</main>

<footer class="footer">
  <p id="footerText"></p>
</footer>

<noscript>
  <div style="max-width:60ch;margin:2rem auto;padding:1rem;font-family:sans-serif">
    <p>This CV needs JavaScript for language and version switching.</p>
    <p>Direct links: <a href="pdfs/Advaiya-Bahl-CV-EN.pdf">English PDF</a> |
    <a href="pdfs/Advaiya-Bahl-CV-SV.pdf">Svensk PDF</a></p>
  </div>
</noscript>

<script src="app.js" defer></script>
</body>
</html>
